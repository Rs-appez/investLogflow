<div id="stocks-container">
    <div class="flex justify-center items-center gap-2 m-4">
        <div class="flex items-center justify-center gap-2 mt-4">
            <button hx-get=""
                    hx-target="#stocks-container"
                    hx-swap="innerHTML"
                    {% if not stocks.has_previous %}disabled {% else %}hx-vals='{"page": "{{ stocks.previous_page_number }}"}'{% endif %}
                    class="btn btn-sm">«</button>
            <input type="number"
                   value="{{ stocks.number }}"
                   name="page"
                   min="1"
                   max="{{ stocks.paginator.num_pages }}"
                   hx-get=""
                   hx-target="#stocks-container"
                   hx-swap="innerHTML"
                   hx-trigger="change"
                   class="input input-sm w-16 text-center [appearance:textfield]">
            <span>of {{ stocks.paginator.num_pages }}</span>
            <button hx-get=""
                    hx-target="#stocks-container"
                    hx-swap="innerHTML"
                    {% if not stocks.has_next %}disabled {% else %}hx-vals='{"page": "{{ stocks.next_page_number }}"}'{% endif %}
                    class="btn btn-sm">»</button>
        </div>
    </div>
    <table class="table w-full table-zebra table-fixed">
        <thead>
            <tr class="bg-primary text-primary-content text-sm uppercase tracking-wider">
                <th class="py-4 w-5 ">
                    <span class="cursor-pointer"
                          hx-get=""
                          hx-target="#stocks-container"
                          hx-swap="innerHTML"
                          hx-vals='{"sort": "ticker", "order": "{% if request.GET.sort == "ticker" and request.GET.order == "asc" %}desc{% else %}asc{% endif %}"}'>
                    Ticker</span>
                </th>
                <th class="py-4 w-10">
                    <span class="cursor-pointer"
                          hx-get=""
                          hx-target="#stocks-container"
                          hx-swap="innerHTML"
                          hx-vals='{"sort": "cik", "order": "{% if request.GET.sort == "cik" and request.GET.order == "asc" %}desc{% else %}asc{% endif %}"}'>
                    Cik</span>
                </th>
                <th class="py-4 w-60">
                    <span class="cursor-pointer"
                          hx-get=""
                          hx-target="#stocks-container"
                          hx-swap="innerHTML"
                          hx-vals='{"sort": "name", "order": "{% if request.GET.sort == "name" and request.GET.order == "asc" %}desc{% else %}asc{% endif %}"}'>
                    Name</span>
                </th>
                <th class="py-4 w-5">
                    <span class="cursor-pointer"
                          hx-get=""
                          hx-target="#stocks-container"
                          hx-swap="innerHTML"
                          hx-vals='{"sort": "type", "order": "{% if request.GET.sort == "type" and request.GET.order == "asc" %}desc{% else %}asc{% endif %}"}'>
                        Type
                    </span>
                </th>
                <th class="py-4 w-10">
                    <span class="cursor-pointer"
                          hx-get=""
                          hx-target="#stocks-container"
                          hx-swap="innerHTML"
                          hx-vals='{"sort": "composite_figi", "order": "{% if request.GET.sort == "composite_figi" and request.GET.order == "asc" %}desc{% else %}asc{% endif %}"}'>
                    Composite Figi</span>
                </th>
                <th class="py-4 w-10">
                    <span class="cursor-pointer"
                          hx-get=""
                          hx-target="#stocks-container"
                          hx-swap="innerHTML"
                          hx-vals='{"sort": "share_class_figi", "order": "{% if request.GET.sort == "share_class_figi" and request.GET.order == "asc" %}desc{% else %}asc{% endif %}"}'>
                    Share Class Figi</span>
                </th>
            </tr>
        </thead>
        <tbody>
            {% for stock in stocks %}
                <tr class="hover:bg-base-300 border-b border-base-content/10 transition-colors duration-150">
                    <td>
                        <span class="badge badge-primary badge-outline font-bold">{{ stock.ticker }}</span>
                    </td>
                    <td class="font-mono text-sm text-base-content/70">{{ stock.cik }}</td>
                    <td class="font-medium">{{ stock.name }}</td>
                    <td>
                        <span class="badge badge-ghost text-xs">{{ stock.type }}</span>
                    </td>
                    <td class="font-mono text-xs text-base-content/60">{{ stock.composite_figi }}</td>
                    <td class="font-mono text-xs text-base-content/60">{{ stock.share_class_figi }}</td>
                </tr>
            {% endfor %}
        </tbody>
    </table>
</div>
